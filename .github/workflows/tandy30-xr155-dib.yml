name: Tandy EX XR155 DIB optimized 16-color experimental driver

on:
  push:
    branches: [tandy16-rendering-performance]
    paths:
      - '.github/workflows/tandy30-xr155-dib.yml'
      - 'tools/tandy30/hpxy_speed/build_xr155_dib.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - name: Install DOSBox-X and FAT16 file tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosbox-x mtools

      - name: Retrieve pinned upstream display driver source and exact DOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/astrobleem/oemdisplay-tandy.git
          git -C upstream fetch --no-tags --depth=1 origin 8d48aa04560a4730c9ee3d946bed865ca9be0c43
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = 8d48aa04560a4730c9ee3d946bed865ca9be0c43
          python3 upstream/tools/BUILDDEPS/DEPS.PY fetch --lock upstream/tools/BUILDDEPS/LOCK.JSON --out dep-git
          python3 upstream/tools/BUILDDEPS/DEPS.PY materialize --lock upstream/tools/BUILDDEPS/LOCK.JSON --repo dep-git --out deps
          python3 upstream/tools/BUILDDEPS/DEPS.PY verify --lock upstream/tools/BUILDDEPS/LOCK.JSON --deps deps
          python3 upstream/tools/BUILDDEPS/DEPS.PY view \
            --lock upstream/tools/BUILDDEPS/LOCK.JSON --deps deps \
            --source-repo upstream \
            --source-commit 8d48aa04560a4730c9ee3d946bed865ca9be0c43 \
            --profile display --out view
          mkdir -p view/experiments view/src/rrect view/src/hpxydib
          for d in HPAN XYPAN XYRRECT; do
            cp -a "upstream/experiments/$d" "view/experiments/$d"
          done
          cp -a upstream/src/rrect/RRPATCH.PY view/src/rrect/
          # DIB optimization was developed after the pinned XR155 source base.
          # Fetch only its exact Git object, without floating main or altering
          # the older compiler/source closure.
          git -C upstream fetch --no-tags --depth=1 origin 263e6d0f5299ee8ffb278493f0587e15698b454c
          git -C upstream show 263e6d0f5299ee8ffb278493f0587e15698b454c:src/hpxydib/DIB.PY > view/src/hpxydib/DIB.PY
          test "$(git -C upstream hash-object ../view/src/hpxydib/DIB.PY)" = e75be73fd88a109ae1f93b85191a7c30337e680b

      - name: Build XR155+DIB and enforce 8086 instructions, NE allocation and patch pins
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tandy30/hpxy_speed/build_xr155_dib.py view /usr/bin/dosbox-x build-xdib
          mkdir -p package
          cp build-xdib/XDIB.DRV package/
          cp build-xdib/XDIB_REPORT.json package/
          (cd package && sha256sum XDIB.DRV > XDIB.DRV.sha256)

      - name: Download exact preferred adaptive-layout CF image without touching gold baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download tandy1000ex-win30-xrcga-t4cga-adaptive-layout-2026-11-06 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern TANDY1000EX_WIN30_XRCGA_T4CGA_ADAPTIVE_LAYOUT_CF.img \
            --dir package
          echo '4f5eb554ced179e8b44cf6c1f74bec53e56c4c6e78fe2123d79da8101325ab9f  package/TANDY1000EX_WIN30_XRCGA_T4CGA_ADAPTIVE_LAYOUT_CF.img' | sha256sum -c -
          cp package/TANDY1000EX_WIN30_XRCGA_T4CGA_ADAPTIVE_LAYOUT_CF.img \
            package/TANDY1000EX_WIN30_XRCGA_DIB_SPEEDTEST_CF.img

      - name: Add new XDIB driver and verified DOS switch, leave default XRCGA unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess
          img='package/TANDY1000EX_WIN30_XRCGA_DIB_SPEEDTEST_CF.img@@32256'
          def get(path):
            local=Path('package')/('get_'+path.replace('/','_'))
            if local.exists():local.unlink()
            subprocess.run(['mcopy','-i',img,'::/'+path,str(local)],check=True)
            return local.read_bytes()
          def put(path,data):
            temp=Path('package')/('put_'+path.replace('/','_'))
            temp.write_bytes(data)
            subprocess.run(['mcopy','-o','-i',img,str(temp),'::/'+path],check=True)
            assert get(path)==data
          report=json.loads(Path('package/XDIB_REPORT.json').read_text())
          driver=Path('package/XDIB.DRV').read_bytes()
          assert hashlib.sha256(driver).hexdigest()==report['sha256']
          src=get('TANDY88/XRCGA.INI')
          assert src.count(b'display.drv=XR155.DRV')==1
          cfg=src.replace(b'display.drv=XR155.DRV',b'display.drv=XDIB.DRV')
          assert len(cfg)==len(src)-1 and b'fonts.fon=CGASYS.FON' in cfg
          bs=get('XRCGA.BAT')
          assert bs.count(b'XRCGA.INI')==1 and b'C:\\WINDOWS\\PROGMAN.INI' in bs
          script=bs.replace(b'XRCGA.INI',b'XDIB.INI').replace(b'XRCGA',b'DIBXY')
          assert script.count(b'C:\\DOS\\FC.EXE /B')==6
          assert b'TANDY88\\M16.GRP' in script
          put('WINDOWS/SYSTEM/XDIB.DRV',driver)
          put('TANDY88/XDIB.INI',cfg)
          put('DIBXY.BAT',script)
          print('PASS: original XRCGA kept as default; type DIBXY then WIN to experiment, XRCGA then WIN to restore')
          PY

      - name: Verify all existing files and exact screen/logo/desktop identities preserved
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys,hashlib,struct,json
          sys.path.insert(0,'tools/tandy30/int33-test')
          from fat16_image import Fat16
          a=Fat16(bytearray(Path('package/TANDY1000EX_WIN30_XRCGA_T4CGA_ADAPTIVE_LAYOUT_CF.img').read_bytes()))
          b=Fat16(bytearray(Path('package/TANDY1000EX_WIN30_XRCGA_DIB_SPEEDTEST_CF.img').read_bytes()))
          assert len(a.b)==len(b.b)==31808*512
          assert a.b[:a.part]==b.b[:b.part]
          fatsz=struct.unpack_from('<H',b.b,b.part+22)[0]*512
          assert b.b[b.fat:b.fat+fatsz]==b.b[b.fat+fatsz:b.fat+2*fatsz]
          def inventory(fs):
            files={}
            def go(pre='',root=None):
              for _,n,attr,c,_ in fs.entries(root):
                if n in ('.','..'):continue
                p=pre+'/'+n
                if attr&16:go(p,c)
                else:files[p]=hashlib.sha256(fs.read(p)).hexdigest()
            go()
            return files
          old,new=inventory(a),inventory(b)
          assert set(old)<=set(new) and all(old[k]==new[k] for k in old)
          assert set(new)-set(old)=={'/WINDOWS/SYSTEM/XDIB.DRV','/TANDY88/XDIB.INI','/DIBXY.BAT'}
          assert a.read('/WINDOWS/SYSTEM.INI')==b.read('/WINDOWS/SYSTEM.INI'), 'XRCGA must remain default'
          assert b.read('/TANDY88/XRCGA.INI')==b.read('/WINDOWS/SYSTEM.INI')
          assert b'fonts.fon=CGASYS.FON' in b.read('/WINDOWS/SYSTEM.INI')
          assert b'display.drv=XR155.DRV' in b.read('/WINDOWS/SYSTEM.INI')
          assert b'display.drv=XDIB.DRV' in b.read('/TANDY88/XDIB.INI')
          assert b.read('/XRCGA.BAT')==a.read('/XRCGA.BAT')
          assert b.read('/T4CGA.BAT')==a.read('/T4CGA.BAT')
          for f in ('/WIN.BAT','/WINDOWS/PROGMAN.INI','/WINDOWS/WIN.INI',
                    '/WINDOWS/MAIN.GRP','/WINDOWS/ACCESSOR.GRP','/WINDOWS/GAMES.GRP',
                    '/WINDOWS/SYSTEM/TANDYDSP.DRV','/WINDOWS/SYSTEM/XR155.DRV',
                    '/WINDOWS/SYSTEM/HPXY.DRV','/WINDOWS/SYSTEM/MSMOUSE1.DRV',
                    '/WINDOWS/SYSTEM/CGASYS.FON','/WINDOWS/PAN.EXE',
                    '/AUTOEXEC.BAT','/CONFIG.SYS'):
            assert a.read(f)==b.read(f),f
          report=json.loads(Path('package/XDIB_REPORT.json').read_text())
          assert hashlib.sha256(b.read('/WINDOWS/SYSTEM/XDIB.DRV')).hexdigest()==report['sha256']
          assert b'RESERVE.COM' in b.read('/WIN.BAT').upper()
          print('PASS all',len(old),'original files unchanged; three new experimental files only')
          print('PASS original boot logo, three-row UI, games, mouse, fonts, original T4CGA and XRCGA preserved')
          PY
          (cd package && sha256sum TANDY1000EX_WIN30_XRCGA_DIB_SPEEDTEST_CF.img > TANDY1000EX_WIN30_XRCGA_DIB_SPEEDTEST_CF.img.sha256)

      - name: Upload verified experimental image and standalone driver
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Tandy_16color_XR155_DIB_unroll_speedtest
          path: |
            package/TANDY1000EX_WIN30_XRCGA_DIB_SPEEDTEST_CF.img
            package/TANDY1000EX_WIN30_XRCGA_DIB_SPEEDTEST_CF.img.sha256
            package/XDIB.DRV
            package/XDIB_REPORT.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable opt-in test release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: tandy1000ex-win30-xrcga-dib-speedtest-2026-11-06
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Already released, never overwrite'
            exit 0
          fi
          gh release create "$TAG" \
            package/TANDY1000EX_WIN30_XRCGA_DIB_SPEEDTEST_CF.img \
            package/TANDY1000EX_WIN30_XRCGA_DIB_SPEEDTEST_CF.img.sha256 \
            package/XDIB.DRV \
            package/XDIB_REPORT.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'EXPERIMENTAL Tandy EX 16-color XR155 fast DIB copy with reversible DIBXY selection' \
            --notes 'An optional faster bitmap import/export experiment. Original 16-color XRCGA (XR155 + compact CGA fonts) is the initial default and all three adaptive Program Manager rows are unchanged. From DOS type DIBXY then WIN to test XDIB.DRV, a MASM 8086-built XR155 variant with upstream four-byte DIB copy loops unrolled; exit Windows and type XRCGA then WIN to return. T4CGA remains original 4-color Tandy fallback. All original files, logo, fonts, games, saved original layouts, mouse, DOS boot, PAN controls and drivers remain byte-identical; three new files only. Static 8086, NE memory, FAT and contents audits pass, but NO actual speedup or physical Tandy correctness is claimed for this new driver until owner tests.' \
            --prerelease --latest=false

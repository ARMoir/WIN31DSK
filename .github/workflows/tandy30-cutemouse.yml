name: Tandy 1000 EX DOS + Windows 3.0 mouse CF image

on:
  workflow_dispatch:
  push:
    branches: [TANDY30]
    paths:
      - '.github/workflows/tandy30-cutemouse.yml'
      - 'tools/tandy30/**'
      - 'builds/TANDY1000EX_WIN30_NOGAMES_16MB.img'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mtools libmspack-dev gcc binutils make git

      - name: Compile 8086-compatible CuteMouse for DOS
        run: bash tools/tandy30/build_cutemouse.sh output

      - name: Expand checksum-pinned Microsoft Mouse 9.01 Windows driver
        run: |
          gcc -Wall -Wextra -Werror -O2 tools/tandy30/expand_kwaj.c -lmspack -o output/expand_kwaj
          python3 tools/tandy30/prepare_msm901.py output/MOUSE.DRV
          echo "ed2510f897a716926a4e9881352b77c8e0921ea9cca37ea820df03dcf3f493ec  output/MOUSE.DRV" | sha256sum -c -

      - name: Resize baseline for physical 31808-sector CF
        run: |
          python3 tools/tandy30/shrink_cf.py \
            builds/TANDY1000EX_WIN30_NOGAMES_16MB.img \
            output/CF_BASE.img

      - name: Assemble DOS mouse tester
        run: |
          as --32 -o output/mtest.o tools/tandy30/mtest.s
          ld -m elf_i386 -Ttext 0x100 --oformat binary -o output/MTEST.COM output/mtest.o

      - name: Install DOS mouse startup and Windows PATH
        run: |
          python3 tools/tandy30/build_mouse.py \
            output/CF_BASE.img \
            output/MOUSE.DRV \
            output/CF_STAGING.img \
            --dos-test output/MTEST.COM \
            --cutemouse output/CTMOUSE.EXE

      - name: Enable Windows 3.0 real-mode mouse through DOS INT 33h
        run: |
          python3 tools/tandy30/int33-test/patch.py \
            output/CF_STAGING.img \
            output/MOUSE.DRV \
            output/TANDY1000EX_DOS_WIN30_MOUSE_CF_31808S.img

      - name: Verify exact card size and checksum
        run: |
          test "$(stat -c%s output/TANDY1000EX_DOS_WIN30_MOUSE_CF_31808S.img)" -eq 16285696
          cd output
          sha256sum -c TANDY1000EX_DOS_WIN30_MOUSE_CF_31808S.img.sha256

      - name: Publish ONE bootable CF image
        uses: actions/upload-artifact@v4
        with:
          name: TANDY1000EX_DOS_WIN30_MOUSE_CF_31808S
          path: |
            output/TANDY1000EX_DOS_WIN30_MOUSE_CF_31808S.img
            output/TANDY1000EX_DOS_WIN30_MOUSE_CF_31808S.img.sha256
          if-no-files-found: error
          retention-days: 30

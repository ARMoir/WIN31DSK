# 192 KiB (196608 bytes) total NE minimum allocation ceiling, with 64 KiB per-segment limit.
# PIXMAX correct-color hardware-tested default; three opt-in aggressive variants.
# November 10 RGBI red/blue correction. Never overwrite the original experimental release.
name: Tandy EX 192KiB turbo limits and 4-color driver memory report

on:
  push:
    branches: [tandy16-rendering-performance]
    paths:
      - '.github/workflows/tandy30-triple-turbo.yml'
      - 'tools/tandy30/hpxy_speed/pixfast.py'
      - 'tools/tandy30/hpxy_speed/build_pixtrials.py'
      - 'tools/tandy30/hpxy_speed/pixtrials.py'
      - 'tools/tandy30/hpxy_speed/pack_pixtrials.py'
      - 'tools/tandy30/hpxy_speed/driver_ne_memory.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pixel-turbo:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4

      - name: Install 16-bit DOS/Windows driver build and FAT16 tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosbox-x mtools

      - name: Retrieve exact upstream XR155 source, toolchain and DIB unroll
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/astrobleem/oemdisplay-tandy.git
          git -C upstream fetch --no-tags --depth=1 origin 8d48aa04560a4730c9ee3d946bed865ca9be0c43
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = 8d48aa04560a4730c9ee3d946bed865ca9be0c43
          python3 upstream/tools/BUILDDEPS/DEPS.PY fetch --lock upstream/tools/BUILDDEPS/LOCK.JSON --out dep-git
          python3 upstream/tools/BUILDDEPS/DEPS.PY materialize --lock upstream/tools/BUILDDEPS/LOCK.JSON --repo dep-git --out deps
          python3 upstream/tools/BUILDDEPS/DEPS.PY verify --lock upstream/tools/BUILDDEPS/LOCK.JSON --deps deps
          python3 upstream/tools/BUILDDEPS/DEPS.PY view \
            --lock upstream/tools/BUILDDEPS/LOCK.JSON --deps deps \
            --source-repo upstream \
            --source-commit 8d48aa04560a4730c9ee3d946bed865ca9be0c43 \
            --profile display --out view
          mkdir -p view/experiments view/src/rrect view/src/hpxydib
          for d in HPAN XYPAN XYRRECT; do
            cp -a "upstream/experiments/$d" "view/experiments/$d"
          done
          cp upstream/src/rrect/RRPATCH.PY view/src/rrect/
          git -C upstream fetch --no-tags --depth=1 origin 263e6d0f5299ee8ffb278493f0587e15698b454c
          git -C upstream show 263e6d0f5299ee8ffb278493f0587e15698b454c:src/hpxydib/DIB.PY > view/src/hpxydib/DIB.PY
          test "$(git -C upstream hash-object ../view/src/hpxydib/DIB.PY)" = e75be73fd88a109ae1f93b85191a7c30337e680b


      - name: Independent original RGBI bit oracle and bank-write simulations
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tandy30/hpxy_speed/pixtrials.py --test

      - name: Compile all three independent trial drivers (MASM, 8086 audit, explicit V20 opcode verification)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          for mode in burst v20 dirty; do
            echo "::group::Compile $mode"
            if ! python3 tools/tandy30/hpxy_speed/build_pixtrials.py view /usr/bin/dosbox-x "build-$mode" "$mode"; then
              echo "::error::Failed $mode driver"
              tail -90 "build-$mode/renderer/EGA/BUILD0.LOG" || true
              tail -65 "build-$mode/renderer/EGA/LINK.LOG" || true
              exit 1
            fi
            case "$mode" in
              burst) name=PIXBURST ;;
              v20) name=PIXV20 ;;
              dirty) name=PIXDIRTY ;;
            esac
            cp "build-$mode/${name}.DRV" "build-$mode/${name}_REPORT.json" package/
            sha256sum "package/${name}.DRV"
            echo "::endgroup::"
          done

      - name: Download exact owner-tested color-fixed PIXMAX default CF card
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download tandy1000ex-win30-pixmax-default-colorfix-2026-11-10 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern TANDY1000EX_WIN30_PIXMAX_DEFAULT_RGBFIX_CF.img --dir package
          echo '29881151baf820b3e6453ebb9c024828109abea111e01fe52555c61a840adf73  package/TANDY1000EX_WIN30_PIXMAX_DEFAULT_RGBFIX_CF.img' | sha256sum -c -

      - name: Audit original Tandy four-color and corrected PIXMAX driver NE allocations
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tandy30/hpxy_speed/driver_ne_memory.py \
            --image package/TANDY1000EX_WIN30_PIXMAX_DEFAULT_RGBFIX_CF.img \
            --output package/NE_MEMORY_REPORT.json

      - name: Attach drivers, DOS selectors and compare every existing file byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tandy30/hpxy_speed/pack_pixtrials.py \
            --source package/TANDY1000EX_WIN30_PIXMAX_DEFAULT_RGBFIX_CF.img \
            --output package/TANDY1000EX_WIN30_PIXMAX_TRIPLE_TURBO_CF.img \
            --package package

      - name: Upload complete 16 MB CF and the three experimental native drivers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PIXMAX_TRIPLE_TURBO_CANDIDATES
          path: |
            package/TANDY1000EX_WIN30_PIXMAX_TRIPLE_TURBO_CF.img
            package/TANDY1000EX_WIN30_PIXMAX_TRIPLE_TURBO_CF.img.sha256
            package/PIXBURST.DRV
            package/PIXBURST_REPORT.json
            package/PIXV20.DRV
            package/PIXV20_REPORT.json
            package/PIXDIRTY.DRV
            package/PIXDIRTY_REPORT.json
            package/NE_MEMORY_REPORT.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish new triple turbo release, leave the working gold baseline unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: tandy1000ex-win30-pixmax-triple-turbo-2026-11-10
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already published with verified assets; keep the existing image immutable'
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
            exit 0
          fi
          gh release create "$TAG" \
            package/TANDY1000EX_WIN30_PIXMAX_TRIPLE_TURBO_CF.img \
            package/TANDY1000EX_WIN30_PIXMAX_TRIPLE_TURBO_CF.img.sha256 \
            package/PIXBURST.DRV package/PIXBURST_REPORT.json \
            package/PIXV20.DRV package/PIXV20_REPORT.json \
            package/PIXDIRTY.DRV package/PIXDIRTY_REPORT.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'ALL OUT: Tandy EX PIXMAX + three optional turbo engines, burst / V20 / dirty' \
            --notes 'Experimental comparison from the owner-verified color-correct PIXMAX default Windows 3.0 image. At DOS (after exiting Windows) run PIXBURST then WIN for two-group unrolling and skip per-group bank wrap when safe; PIXV20 then WIN for NEC V20-only 80186 immediate-count shifts (do not run on stock Intel 8088/8086); PIXDIRTY then WIN to skip matching 16-bit video words after B800h reads. Restore known-good with PIXMAX then WIN, DIBXY then WIN or four-color original with T4CGA then WIN. All original files and the Windows boot logo, mouse, fonts, 16-color panning, three-row groups and old releases are unchanged. Exactly 9 opt-in files added. Compilers, memory limits, bit-order oracle and simulated video-write regression tests pass. Performance or physical graphics correctness of these three experimental drivers is NOT yet confirmed; the dirty comparison could be slower than straight writes. Do not call any new experiment the default until tested on real V20.' \
            --prerelease --latest=false

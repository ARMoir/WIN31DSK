name: Tandy EX RRECT bounded-framebuffer 16-color driver

on:
  push:
    branches: [tandy16-rendering-performance]
    paths:
      - '.github/workflows/tandy30-rrect-driver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Install DOSBox-X for real-mode MASM build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosbox-x mtools

      - name: Fetch pinned upstream source
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/astrobleem/oemdisplay-tandy.git
          git -C upstream fetch --no-tags --depth=1 origin 4fe890a951d93826e9ced6dbb98934ef6e0dccd0
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = 4fe890a951d93826e9ced6dbb98934ef6e0dccd0

      - name: Fetch and verify exact archived 16-bit DDK and compiler bytes
        run: |
          set -euo pipefail
          python3 upstream/tools/BUILDDEPS/DEPS.PY fetch --lock upstream/tools/BUILDDEPS/LOCK.JSON --out dep-git
          python3 upstream/tools/BUILDDEPS/DEPS.PY materialize --lock upstream/tools/BUILDDEPS/LOCK.JSON --repo dep-git --out deps
          python3 upstream/tools/BUILDDEPS/DEPS.PY verify --lock upstream/tools/BUILDDEPS/LOCK.JSON --deps deps
          python3 upstream/tools/BUILDDEPS/DEPS.PY view --lock upstream/tools/BUILDDEPS/LOCK.JSON --deps deps --source-repo upstream --source-commit 4fe890a951d93826e9ced6dbb98934ef6e0dccd0 --profile display --out view
          cp -a upstream/src/rrect view/src/rrect

      - name: Reproduce exact original TR5 320x200x16 binary
        run: |
          set -euo pipefail
          python3 view/src/rrect/RRBUILD.PY --repo view --dosbox /usr/bin/dosbox-x --out build-original --mode 320x200x16 --variant baseline
          find build-original -maxdepth 1 -name '*.DRV' -ls
          echo '33f681b0238310ae2614b3c1b923d260c816261442b1fa5cd51867c25a6cef61  build-original/TR53216.DRV' | sha256sum -c -

      - name: Build only the bounded-update RRECT candidate and audit real-mode code
        run: |
          set -euo pipefail
          python3 view/src/rrect/RRBUILD.PY --repo view --dosbox /usr/bin/dosbox-x --out build-rrect --mode 320x200x16 --variant candidate
          test -s build-rrect/TR53216.DRV
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("build-original/RRBUILD.JSN").read_text())
          b=json.loads(Path("build-rrect/RRBUILD.JSN").read_text())
          assert a["sha256"]=="33f681b0238310ae2614b3c1b923d260c816261442b1fa5cd51867c25a6cef61"
          assert a["variant"]=="baseline" and b["variant"]=="candidate"
          assert b["sha256"]!=a["sha256"] and b["bytes"]>a["bytes"]
          assert b["runtime"]=="NOT_TESTED by this build"
          print("PASS base/recompiled candidate audit",b["sha256"],b["bytes"])
          PY
          mkdir -p verified
          cp build-rrect/TR53216.DRV verified/RRECT.DRV
          cp build-rrect/RRBUILD.JSN verified/
          sha256sum verified/RRECT.DRV > verified/SHA256SUMS

      - name: Upload audited RRECT driver for isolated physical trial
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tandy-rrect-16color-driver
          path: verified/*
          if-no-files-found: error
          retention-days: 30

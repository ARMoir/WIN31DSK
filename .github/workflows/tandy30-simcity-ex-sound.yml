name: Tandy 1000 EX SimCity sound shim - DOS build and test

on:
  workflow_dispatch:
  push:
    branches: [TANDY30]
    paths:
      - '.github/workflows/tandy30-simcity-ex-sound.yml'
      - 'tools/tandy30/simcity-ex-sound/**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-in DOS binaries before rebuilding
        run: |
          cd tools/tandy30/simcity-ex-sound
          echo 'bc9b26c7f751f7f5fb357fdb6d71dc44ce01458d408da9ec51a151e4b5d0ece0  SCEXSND.COM' | sha256sum -c -
          echo 'ed843532538d7939c1871fd52dbd453b41f07009e4ed64e4a2d30c71c83b96c5  TESTSND.COM' | sha256sum -c -
          echo 'cc9bc2679d0fb433e389a37fdb81ace8ba8c771c01cd2d474bedf926cdd757c7  TSRPROBE.COM' | sha256sum -c -
          echo 'f47360b9965b167a9eb47e2279e4628e4e61f9d99e47c44ab1bb66c6452e3946  SCGATE.COM' | sha256sum -c -
      - name: Build original V20-compatible DOS COM executables
        run: sh tools/tandy30/simcity-ex-sound/BUILD.SH
      - name: Verify rebuilt DOS format and sizes across GNU assembler versions
        run: |
          cd tools/tandy30/simcity-ex-sound
          test "$(stat -c%s SCEXSND.COM)" -eq 1008
          test "$(stat -c%s TESTSND.COM)" -eq 544
          strings SCEXSND.COM | grep -F 'SCEXSND 0.31:'
          strings TESTSND.COM | grep -F 'SCEXSND 0.31 detected'
      - name: Run static build and payload checks
        run: python3 tools/tandy30/simcity-ex-sound/test_build.py
      - name: Audit 8086 instructions and synthetic sample pitches
        run: python3 tools/tandy30/simcity-ex-sound/test_driver.py
      - name: Upload driver and sound test with instructions
        uses: actions/upload-artifact@v4
        with:
          name: SCEXSND_TANDY_EX_3VOICE_v031
          path: |
            tools/tandy30/simcity-ex-sound/SCEXSND.COM
            tools/tandy30/simcity-ex-sound/SCEX30.COM
            tools/tandy30/simcity-ex-sound/TESTSND.COM
            tools/tandy30/simcity-ex-sound/TSRPROBE.COM
            tools/tandy30/simcity-ex-sound/HOOK1A.COM
            tools/tandy30/simcity-ex-sound/HOOK1C.COM
            tools/tandy30/simcity-ex-sound/SCGATE.COM
            tools/tandy30/simcity-ex-sound/README.md
          retention-days: 30
          if-no-files-found: error

name: Tandy 1000 EX Windows 3.0 mouse image

on:
  workflow_dispatch:
  push:
    branches: [TANDY30]
    paths:
      - '.github/workflows/tandy30-mouse.yml'
      - 'tools/tandy30/**'
      - 'drivers/tandy30/**'
      - 'builds/TANDY1000EX_WIN30_NOGAMES_16MB.img'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FAT image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y mtools libmspack-dev gcc binutils
      - name: Build KWAJ extraction utility
        run: |
          mkdir -p output
          gcc -Wall -Wextra -Werror -O2 tools/tandy30/expand_kwaj.c -lmspack -o output/expand_kwaj
      - name: Download and expand Microsoft Mouse 9.01 Windows driver
        run: python3 tools/tandy30/prepare_msm901.py output/MOUSE.DRV
      - name: Resize baseline to physical CF card capacity (31808 sectors)
        run: |
          python3 tools/tandy30/shrink_cf.py \
            builds/TANDY1000EX_WIN30_NOGAMES_16MB.img \
            output/TANDY1000EX_WIN30_CF_BASE.img
      - name: Assemble 8086-compatible DOS mouse diagnostic
        run: |
          as --32 -o output/mtest.o tools/tandy30/mtest.s
          ld -m elf_i386 -Ttext 0x100 --oformat binary -o output/MTEST.COM output/mtest.o
          test "$(stat -c%s output/MTEST.COM)" -le 8192
      - name: Build mouse-enabled CF image
        run: |
          python3 tools/tandy30/build_mouse.py \
            output/TANDY1000EX_WIN30_CF_BASE.img \
            output/MOUSE.DRV \
            output/TANDY1000EX_WIN30_MOUSE_CF_31808S.img \
            --dos-test output/MTEST.COM
      - name: Upload image and checksum
        uses: actions/upload-artifact@v4
        with:
          name: TANDY1000EX_WIN30_MOUSE_CF_31808S
          path: |
            output/TANDY1000EX_WIN30_MOUSE_CF_31808S.img
            output/TANDY1000EX_WIN30_MOUSE_CF_31808S.img.sha256
            output/MTEST.COM
          if-no-files-found: error
          retention-days: 30

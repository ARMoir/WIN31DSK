name: Tandy EX DIBXY default with bounded BitBlt rectangle repaint trial

on:
  push:
    branches: [tandy16-rendering-performance]
    paths:
      - '.github/workflows/tandy30-dibxy-repaint.yml'
      - 'tools/tandy30/hpxy_speed/build_xr155_dib_repaint.py'
      - 'tools/tandy30/hpxy_speed/repaint_bitblt.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - name: Install DOSBox-X and FAT16 file tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosbox-x mtools

      - name: Retrieve pinned upstream display driver source and exact DOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/astrobleem/oemdisplay-tandy.git
          git -C upstream fetch --no-tags --depth=1 origin 8d48aa04560a4730c9ee3d946bed865ca9be0c43
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = 8d48aa04560a4730c9ee3d946bed865ca9be0c43
          python3 upstream/tools/BUILDDEPS/DEPS.PY fetch --lock upstream/tools/BUILDDEPS/LOCK.JSON --out dep-git
          python3 upstream/tools/BUILDDEPS/DEPS.PY materialize --lock upstream/tools/BUILDDEPS/LOCK.JSON --repo dep-git --out deps
          python3 upstream/tools/BUILDDEPS/DEPS.PY verify --lock upstream/tools/BUILDDEPS/LOCK.JSON --deps deps
          python3 upstream/tools/BUILDDEPS/DEPS.PY view \
            --lock upstream/tools/BUILDDEPS/LOCK.JSON --deps deps \
            --source-repo upstream \
            --source-commit 8d48aa04560a4730c9ee3d946bed865ca9be0c43 \
            --profile display --out view
          mkdir -p view/experiments view/src/rrect view/src/hpxydib
          for d in HPAN XYPAN XYRRECT; do
            cp -a "upstream/experiments/$d" "view/experiments/$d"
          done
          cp -a upstream/src/rrect/RRPATCH.PY view/src/rrect/
          # DIB optimization was developed after the pinned XR155 source base.
          # Fetch only its exact Git object, without floating main or altering
          # the older compiler/source closure.
          git -C upstream fetch --no-tags --depth=1 origin 263e6d0f5299ee8ffb278493f0587e15698b454c
          git -C upstream show 263e6d0f5299ee8ffb278493f0587e15698b454c:src/hpxydib/DIB.PY > view/src/hpxydib/DIB.PY
          test "$(git -C upstream hash-object ../view/src/hpxydib/DIB.PY)" = e75be73fd88a109ae1f93b85191a7c30337e680b


      - name: Compile XR155+DIB plus conservative bounded BitBlt repaint
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tandy30/hpxy_speed/build_xr155_dib_repaint.py view /usr/bin/dosbox-x build-repaint
          mkdir -p package
          cp build-repaint/RPAINT.DRV package/
          cp build-repaint/RPAINT_REPORT.json package/
          (cd package && sha256sum RPAINT.DRV > RPAINT.DRV.sha256)

      - name: Download exactly pinned DIBXY experimental CF image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download tandy1000ex-win30-xrcga-dib-speedtest-2026-11-06 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern TANDY1000EX_WIN30_XRCGA_DIB_SPEEDTEST_CF.img \
            --dir package
          echo 'adca85db75d58d33238d4e39fdd1138180776c77fd16d8b322c796159aefcb8c  package/TANDY1000EX_WIN30_XRCGA_DIB_SPEEDTEST_CF.img' | sha256sum -c -
          cp package/TANDY1000EX_WIN30_XRCGA_DIB_SPEEDTEST_CF.img \
            package/TANDY1000EX_WIN30_DIBXY_DEFAULT_REPAINT_TEST_CF.img

      - name: Default to owner-tested DIBXY and install separate optional REPIX repaint profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          disk='package/TANDY1000EX_WIN30_DIBXY_DEFAULT_REPAINT_TEST_CF.img@@32256'
          def get(path):
            local=Path('package')/('get_'+path.replace('/','_'))
            if local.exists():local.unlink()
            subprocess.run(['mcopy','-i',disk,'::/'+path,str(local)],check=True)
            return local.read_bytes()
          def put(path,data):
            tmp=Path('package')/('put_'+path.replace('/','_'))
            tmp.write_bytes(data)
            subprocess.run(['mcopy','-o','-i',disk,str(tmp),'::/'+path],check=True)
            assert get(path)==data
          report=json.loads(Path('package/RPAINT_REPORT.json').read_text())
          driver=Path('package/RPAINT.DRV').read_bytes()
          assert hashlib.sha256(driver).hexdigest()==report['sha256']
          # DIBXY is now the ACTIVE default. It has already booted on real EX.
          standard=get('TANDY88/XDIB.INI')
          assert standard.count(b'display.drv=XDIB.DRV')==1
          assert b'fonts.fon=CGASYS.FON' in standard
          put('WINDOWS/SYSTEM.INI',standard)
          # A single change in the display driver filename selects the
          # new repainter. Both use identical CGA fonts and panning settings.
          experimental=standard.replace(b'display.drv=XDIB.DRV',b'display.drv=RPAINT.DRV')
          assert experimental.count(b'display.drv=RPAINT.DRV')==1
          saved=get('DIBXY.BAT')
          assert saved.count(b'XDIB.INI')>=3
          assert saved.count(b'C:\\DOS\\FC.EXE /B')==6
          chooser=saved.replace(b'XDIB.INI',b'RPAINT.INI').replace(b'DIBXY',b'REPIX')
          assert chooser.count(b'RPAINT.INI')==saved.count(b'XDIB.INI')
          assert chooser.count(b'C:\\DOS\\FC.EXE /B')==6
          assert b'C:\\WINDOWS\\PROGMAN.INI' in chooser
          put('WINDOWS/SYSTEM/RPAINT.DRV',driver)
          put('TANDY88/RPAINT.INI',experimental)
          put('REPIX.BAT',chooser)
          print('PASS: DIBXY is default, REPIX is optional, XRCGA/T4CGA unchanged')
          PY

      - name: Verify logo, fonts, exact three-row layouts, original drivers and DOS switchers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys,hashlib,struct,json
          sys.path.insert(0,'tools/tandy30/int33-test')
          from fat16_image import Fat16
          a=Fat16(bytearray(Path('package/TANDY1000EX_WIN30_XRCGA_DIB_SPEEDTEST_CF.img').read_bytes()))
          b=Fat16(bytearray(Path('package/TANDY1000EX_WIN30_DIBXY_DEFAULT_REPAINT_TEST_CF.img').read_bytes()))
          assert len(a.b)==len(b.b)==31808*512
          assert a.b[:a.part]==b.b[:b.part], 'Boot MBR or partition changed'
          fatlen=struct.unpack_from('<H',b.b,b.part+22)[0]*512
          assert b.b[b.fat:b.fat+fatlen]==b.b[b.fat+fatlen:b.fat+2*fatlen], 'FAT mirror mismatch'
          def files(fs):
            d={}
            def traverse(root=None,prefix=''):
              for _,name,attr,cluster,_ in fs.entries(root):
                if name in ('.','..'):continue
                p=prefix+'/'+name
                if attr&16:traverse(cluster,p)
                else:d[p]=hashlib.sha256(fs.read(p)).hexdigest()
            traverse();return d
          old,new=files(a),files(b)
          assert set(old)<=set(new),set(old)-set(new)
          assert {k for k in old if old[k]!=new[k]}=={'/WINDOWS/SYSTEM.INI'},'Only active display selection changed'
          assert set(new)-set(old)=={'/WINDOWS/SYSTEM/RPAINT.DRV','/TANDY88/RPAINT.INI','/REPIX.BAT'}
          assert b.read('/WINDOWS/SYSTEM.INI')==b.read('/TANDY88/XDIB.INI')
          assert b'fonts.fon=CGASYS.FON' in b.read('/WINDOWS/SYSTEM.INI')
          assert b'display.drv=XDIB.DRV' in b.read('/WINDOWS/SYSTEM.INI')
          assert b'display.drv=RPAINT.DRV' in b.read('/TANDY88/RPAINT.INI')
          assert b.read('/WINDOWS/WIN.INI')==b.read('/TANDY88/WINXR.INI')
          for p in ('/WINDOWS/PROGMAN.INI','/WINDOWS/MAIN.GRP','/WINDOWS/ACCESSOR.GRP',
                    '/WINDOWS/GAMES.GRP','/WINDOWS/PAN.EXE','/WIN.BAT','/AUTOEXEC.BAT',
                    '/CONFIG.SYS','/DIBXY.BAT','/XRCGA.BAT','/T4CGA.BAT',
                    '/WINDOWS/SYSTEM/XDIB.DRV','/WINDOWS/SYSTEM/XR155.DRV',
                    '/WINDOWS/SYSTEM/HPXY.DRV','/WINDOWS/SYSTEM/TANDYDSP.DRV',
                    '/WINDOWS/SYSTEM/MSMOUSE1.DRV','/WINDOWS/SYSTEM/CGASYS.FON'):
            assert a.read(p)==b.read(p),p
          assert b'RESERVE.COM' in b.read('/WIN.BAT').upper()
          assert b'WIN.COM /R' in b.read('/WIN.BAT').upper()
          assert b'load=C:\\WINDOWS\\PAN.EXE' in b.read('/WINDOWS/WIN.INI')
          report=json.loads(Path('package/RPAINT_REPORT.json').read_text())
          assert hashlib.sha256(b.read('/WINDOWS/SYSTEM/RPAINT.DRV')).hexdigest()==report['sha256']
          assert b.read('/REPIX.BAT').count(b'C:\\DOS\\FC.EXE /B')==6
          for p in old:
            if any(p.endswith(e) for e in ('.EXE','.COM','.DRV','.FON','.GRP','.BMP','.TXT')) or 'LOGO' in p or 'SPLASH' in p:
              assert old[p]==new[p],p
          print('PASS:',len(old),'original files, only SYSTEM.INI changed, 3 new optional test files')
          print('PASS: same startup logo, three-row Program Manager, all games, fonts, serial mouse, panning and old 4-color option')
          PY
          (cd package && sha256sum TANDY1000EX_WIN30_DIBXY_DEFAULT_REPAINT_TEST_CF.img > TANDY1000EX_WIN30_DIBXY_DEFAULT_REPAINT_TEST_CF.img.sha256)

      - name: Upload compiled 16 MB CF image and RPAINT driver
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Tandy_DIBXY_Default_REPIX_Optimized_Repaint_Trial
          path: |
            package/TANDY1000EX_WIN30_DIBXY_DEFAULT_REPAINT_TEST_CF.img
            package/TANDY1000EX_WIN30_DIBXY_DEFAULT_REPAINT_TEST_CF.img.sha256
            package/RPAINT.DRV
            package/RPAINT_REPORT.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish separate experiment, never replace gold standard or DIBXY releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: tandy1000ex-win30-dibxy-default-repaint-2026-11-06
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release remains unchanged'
            exit 0
          fi
          gh release create "$TAG" \
            package/TANDY1000EX_WIN30_DIBXY_DEFAULT_REPAINT_TEST_CF.img \
            package/TANDY1000EX_WIN30_DIBXY_DEFAULT_REPAINT_TEST_CF.img.sha256 \
            package/RPAINT.DRV \
            package/RPAINT_REPORT.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Tandy EX: DIBXY default, optional bounded BitBlt repaint, CGA fonts, four-color fallback' \
            --notes 'Separate EXPERIMENTAL 16 MB CF image. Default boots user-tested DIBXY (XR155+DIB) + compact CGA fonts, 320x200 16 colors, 640x256 panning, three-row Main/Accessories/Games. From DOS after Windows exits run REPIX then WIN to select the new experimental RPAINT.DRV, which conservatively redraws only a proven BitBlt destination rectangle instead of the entire affected rows, falling back to full conversion for unknown bounds and resync. Revert via DIBXY then WIN. XRCGA and original Microsoft T4CGA four-color profiles remain available. The beloved Windows boot logo, all games, all original 389+ files, original font and mouse binaries and screen layout are byte-identical to the tested DIBXY base. New driver passes 8086 MASM, NE memory and FAT identity checks, but does NOT have a physical Tandy qualification or proven performance improvement. Never overwrite the gold standard.' \
            --prerelease --latest=false
